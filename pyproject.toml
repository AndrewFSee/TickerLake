[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickerlake"
version = "0.1.0"
description = "Automated daily collection of free financial data into a queryable Parquet/DuckDB lake for ML."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "yfinance[repair]>=1.7.0",  # [repair] pulls scipy/scikit-learn for Yahoo bad-tick repair
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=9.0",
    "tqdm>=4.66",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
tickerlake = "tickerlake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tickerlake"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
