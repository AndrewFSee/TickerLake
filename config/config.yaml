# TickerLake configuration.
# Secrets live in .env, never here. Anything referencing an API key reads it from
# the environment at runtime.

storage:
  # Root of the data lake. Relative paths resolve against the project root.
  # Override with TICKERLAKE_DATA_ROOT.
  root: data
  # zstd gives ~2x better compression than snappy on options data at similar read speed.
  compression: zstd
  compression_level: 3
  # Target size for compacted files. Below this, compaction merges more aggressively.
  target_file_mb: 128

universe:
  index: SP500
  # Primary seed: interval-shaped point-in-time membership, handles index re-entry.
  membership_seed_url: "https://raw.githubusercontent.com/fja05680/sp500/master/sp500_ticker_start_end.csv"
  # Verification source: dated full-constituent snapshots. Used by `verify-membership`
  # to rebuild intervals independently and diff them against the seed.
  membership_snapshot_url: "https://raw.githubusercontent.com/fja05680/sp500/master/S%26P%20500%20Historical%20Components%20%26%20Changes%20(Updated).csv"
  # Live (today's) constituents. Updated same-day, unlike the GitHub mirror.
  live_url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies"
  # Earliest membership interval to retain when seeding.
  history_start: "2010-01-01"
  # A tracked symbol that returns no data for this many consecutive runs is flagged
  # as a suspected silent delisting. Flagged, never deleted.
  silent_delist_threshold_runs: 5
  # Stop requesting new data this many days after an official index removal.
  # History is retained forever regardless.
  post_removal_grace_days: 30

ohlcv:
  enabled: true
  start_date: "2010-01-01"
  interval: "1d"
  # yfinance batches multiple symbols per HTTP request. 50 is well within limits
  # and cuts the daily incremental pull to ~10 requests.
  batch_size: 50
  # Seconds between batched requests.
  throttle_seconds: 1.0
  auto_adjust: false      # keep raw OHLC; adjusted close stored as a separate column
  # yfinance's bad-tick repair (needs scipy). Catches Yahoo's 100x price errors
  # and missed split adjustments. Slower, but this is a permanent archive.
  repair: true
  # Days of history re-fetched each run. Yahoo revises recent bars, and a
  # merge-on-write makes re-fetching them free of duplicates.
  lookback_days: 5
  include_actions: true   # dividends + splits, needed to build adjusted series later
  # Backfill uses larger, slower batches since it is a one-time cost.
  backfill_batch_size: 25
  backfill_throttle_seconds: 2.0

etfs:
  # ETFs are tracked for collection but are NOT index constituents. They live
  # under index_name=ETF in the membership table, so every fetcher picks them up
  # while members_on() and the point-in-time survivorship queries stay strictly
  # S&P 500. Filing them under SP500 would make members_on() return ~560 names
  # and quietly corrupt every survivorship-sensitive result.
  #
  # ETFs are also not perishable in the way constituents are: nothing is added
  # or dropped by a committee, so this list only changes when you edit it. An
  # ETF that closes has its interval closed like any delisted stock, and its
  # history is retained.
  enabled: true
  index_name: ETF
  # History start for ETF OHLCV backfill. Many predate 2010; the fetcher simply
  # takes whatever the source returns from this date forward.
  history_start: "2010-01-01"
  symbols:
    # --- Broad US equity: the market itself, plus breadth -------------------
    SPY:  "SPDR S&P 500"
    VOO:  "Vanguard S&P 500"
    VTI:  "Vanguard Total Stock Market"
    QQQ:  "Invesco Nasdaq 100"
    IWM:  "iShares Russell 2000 (small cap)"
    DIA:  "SPDR Dow Jones Industrial Average"
    MDY:  "SPDR S&P MidCap 400"
    # Equal-weight vs cap-weight is one of the cleanest free breadth signals:
    # RSP/SPY diverging means the index is being carried by a few names.
    RSP:  "Invesco S&P 500 Equal Weight"

    # --- Style and factor exposure ------------------------------------------
    VUG:  "Vanguard Growth"
    VTV:  "Vanguard Value"
    IWF:  "iShares Russell 1000 Growth"
    IWD:  "iShares Russell 1000 Value"
    MTUM: "iShares MSCI USA Momentum"
    QUAL: "iShares MSCI USA Quality"
    USMV: "iShares MSCI USA Min Volatility"
    VLUE: "iShares MSCI USA Value"
    SCHD: "Schwab US Dividend Equity"
    VYM:  "Vanguard High Dividend Yield"
    NOBL: "ProShares S&P 500 Dividend Aristocrats"

    # --- The 11 GICS sectors (SPDR Select Sector) ---------------------------
    XLK:  "Technology"
    XLF:  "Financials"
    XLE:  "Energy"
    XLV:  "Health Care"
    XLI:  "Industrials"
    XLY:  "Consumer Discretionary"
    XLP:  "Consumer Staples"
    XLU:  "Utilities"
    XLB:  "Materials"
    XLRE: "Real Estate"
    XLC:  "Communication Services"

    # --- High-beta industry proxies that move on macro ----------------------
    SMH:  "VanEck Semiconductors"
    XBI:  "SPDR S&P Biotech"
    KRE:  "SPDR S&P Regional Banking"
    ITB:  "iShares US Home Construction"
    XOP:  "SPDR S&P Oil & Gas Exploration"
    XRT:  "SPDR S&P Retail"
    IYT:  "iShares US Transportation"

    # --- Fixed income: duration ladder, credit, inflation -------------------
    TLT:  "iShares 20+ Year Treasury"
    IEF:  "iShares 7-10 Year Treasury"
    SHY:  "iShares 1-3 Year Treasury"
    AGG:  "iShares Core US Aggregate Bond"
    LQD:  "iShares Investment Grade Corporate"
    HYG:  "iShares High Yield Corporate"
    JNK:  "SPDR Bloomberg High Yield"
    TIP:  "iShares TIPS Bond"

    # --- Commodities --------------------------------------------------------
    GLD:  "SPDR Gold Shares"
    SLV:  "iShares Silver Trust"
    USO:  "United States Oil Fund"
    UNG:  "United States Natural Gas Fund"
    DBC:  "Invesco DB Commodity Index"

    # --- International ------------------------------------------------------
    EFA:  "iShares MSCI EAFE (developed ex-US)"
    EEM:  "iShares MSCI Emerging Markets"
    VEA:  "Vanguard FTSE Developed Markets"
    VWO:  "Vanguard FTSE Emerging Markets"
    ACWI: "iShares MSCI ACWI (all country)"
    FXI:  "iShares China Large-Cap"
    EWJ:  "iShares MSCI Japan"

    # --- Real estate and volatility -----------------------------------------
    VNQ:  "Vanguard Real Estate"
    IYR:  "iShares US Real Estate"
    # VIX futures. Structurally decays, so use it as a signal, never as a hold.
    VXX:  "iPath Series B S&P 500 VIX Short-Term Futures"


intraday:
  # Intraday bars - the finest free granularity available, and it EXPIRES.
  # Yahoo retains roughly 30 days of 1-minute bars and then drops them for good,
  # so an uncollected day is unrecoverable, exactly like an option chain.
  # Measured per-request limits: 1m=8d, 2m/5m/15m/30m=60d, 1h=730d.
  #
  # These are bars, not ticks: no trade-level detail, no bid/ask, no trade
  # conditions. Free consolidated tick data does not exist; see the README.
  enabled: true
  interval: "1m"
  # Must stay inside Yahoo's per-request span for the chosen interval. The
  # fetcher clamps and warns rather than letting the request fail.
  lookback_days: 5
  batch_size: 25
  throttle_seconds: 1.0
  # Pre/post-market bars are thin and frequently erroneous, but they are also
  # where overnight-gap signals live.
  include_prepost: false

options:
  enabled: true
  # Every expiration: weeklies, 0DTE, monthlies, LEAPS. Filters below are all
  # disabled by default - you can never recover a snapshot you didn't take.
  max_dte: null           # e.g. 400 to cap at ~13 months
  monthlies_only: false
  include_weeklies: true
  # Throttling. These are the knobs that decide whether Yahoo blocks you.
  # Delay between individual expiration requests within a symbol.
  throttle_seconds: 0.6
  # Additional delay between symbols.
  inter_symbol_seconds: 0.4
  # Random jitter (+/- this fraction) applied to every delay, so the request
  # pattern does not look metronomic.
  jitter_pct: 0.35
  # Adaptive backoff on HTTP 429 / YFRateLimitError.
  rate_limit_backoff_seconds: 90
  rate_limit_max_backoff_seconds: 900
  # After a 429, multiply all delays by this and decay back toward baseline on success.
  rate_limit_slowdown_factor: 2.0
  # Per-symbol retry within the run.
  max_retries_per_symbol: 3
  # Symbols that failed are retried once more at the end of the run.
  retry_failed_at_end: true
  # Abort the whole run if this fraction of symbols fails - implies a systemic
  # block rather than scattered bad tickers.
  abort_failure_rate: 0.4
  # Checkpoint every N symbols (checkpointing is also implicit: a symbol's output
  # file existing means it is done).
  checkpoint_every: 10
  # Skip symbols with no listed options rather than treating it as a failure.
  skip_symbols_without_options: true
  # Fraction of contracts that must carry a non-zero bid for the snapshot to be
  # considered usable. Yahoo serves the strike ladder around the clock but only
  # populates bid/ask while quotes are live, so a pre-open or overnight run
  # yields a complete-looking snapshot with ~8% bid coverage and no solvable
  # implied volatility. Below this the run warns loudly instead of failing --
  # the data is still worth keeping, it just cannot support IV.
  min_bid_coverage: 0.25

sec_edgar:
  enabled: true
  # SEC allows 10 req/s with a proper User-Agent. We stay well under.
  requests_per_second: 5.0
  form_types: ["10-K", "10-Q", "8-K"]
  # Pull filings first submitted on or after this date.
  start_date: "2010-01-01"
  # Store the extracted primary document text alongside metadata.
  store_text: true
  max_text_chars: 2000000
  # Also pull the XBRL companyfacts endpoint (structured fundamentals).
  fetch_companyfacts: true

fred:
  enabled: true
  requests_per_second: 5.0
  # Curated macro set. Add any FRED series id here.
  series:
    - DGS10        # 10Y Treasury constant maturity
    - DGS2         # 2Y Treasury
    - DGS3MO       # 3M Treasury
    - T10Y2Y       # 10Y-2Y spread (recession signal)
    - T10Y3M       # 10Y-3M spread
    - FEDFUNDS     # Effective fed funds rate
    - CPIAUCSL     # CPI, all urban consumers
    - CPILFESL     # Core CPI
    - UNRATE       # Unemployment rate
    - PAYEMS       # Nonfarm payrolls
    - INDPRO       # Industrial production
    - UMCSENT      # Consumer sentiment
    - VIXCLS       # VIX close
    - DTWEXBGS     # Broad dollar index
    - M2SL         # M2 money stock
    - GDPC1        # Real GDP
    - HOUST        # Housing starts
    - DCOILWTICO   # WTI crude
    # Credit stress. BAMLH0A0HYM2 is the usual choice, but FRED only serves the
    # trailing ~3 years of ICE BofA data (licensed), so it is kept for recent
    # detail and paired with Moody's spreads that go back to the 1980s.
    - BAMLH0A0HYM2 # High-yield OAS (only ~3y of history available on FRED)
    - BAA10Y       # Moody's Baa minus 10Y Treasury (1986-, full history)
    - AAA10Y       # Moody's Aaa minus 10Y Treasury (1983-, full history)
    - NFCI         # Chicago Fed National Financial Conditions Index (1971-, weekly)
    - STLFSI4      # St. Louis Fed Financial Stress Index (1993-, weekly)
    # Inflation expectations and real rates - among the most useful macro
    # features available free, and absent from the original set.
    - T5YIE        # 5Y breakeven inflation
    - T10YIE       # 10Y breakeven inflation
    - DFII10       # 10Y TIPS real yield
    - PCEPILFE     # Core PCE (the Fed's preferred gauge)
    # Liquidity and activity
    - SOFR         # Secured overnight financing rate
    - WALCL        # Fed balance sheet total assets (weekly)
    - ICSA         # Initial jobless claims (weekly, leading indicator)
    - RSAFS        # Advance retail sales

gdelt:
  enabled: true
  requests_per_second: 1.0
  # GDELT rejects aggressive querying; it is a free public service.
  lookback_days: 1
  max_records_per_query: 250
  # Number of 15-minute GKG bulk files to pull per run, newest first. Each is
  # ~6 MB zipped and holds ~1,400 articles worldwide. 16 files = the most recent
  # 4 hours, which for an after-close run covers the US trading afternoon.
  # A full day would be 96 files and ~600 MB.
  max_files: 16
  max_attempts: 3
  requests_per_second: 2.0
  # Query the tracked universe by company name, plus these macro themes.
  themes:
    - ECON_INTERESTRATE
    - ECON_STOCKMARKET
    - ECON_INFLATION
    - ECON_EARNINGSREPORT

finnhub:
  # Secondary/cross-check source. Disabled until a key is present.
  enabled: true
  requests_per_second: 1.0   # free tier is 60/min
  fetch_company_news: true
  fetch_quote_crosscheck: true
  # Cross-check a random sample of N symbols/day against yfinance closes rather
  # than all 500, to stay inside the free tier.
  crosscheck_sample_size: 50
  news_lookback_days: 1

finra:
  # Daily short sale volume. Free, no key, one flat file per trading day.
  # Note this is short *volume* (intraday flow, includes market-maker hedging),
  # not short *interest* (accumulated positioning, reported bi-monthly).
  enabled: true
  requests_per_second: 2.0
  lookback_days: 5
  force_refetch: false

earnings:
  # Earnings surprises, forward calendar, and analyst recommendations.
  # All on Finnhub's free tier, so no Alpha Vantage key is needed.
  enabled: true
  requests_per_second: 1.0
  fetch_calendar: true
  fetch_surprises: true
  fetch_recommendations: true
  calendar_days_ahead: 45
  surprise_symbols_per_run: 60
  recommendation_symbols_per_run: 60

options_analytics:
  # Derived: solves implied volatility and Greeks from the stored chains using
  # the FRED curve for discounting. A transform, not a fetch - safe to re-run
  # over any past snapshot, which is why it is stored separately from the raw
  # chains rather than folded into them.
  enabled: true

pipeline:
  # Order matters: universe must refresh before anything that iterates symbols,
  # and options_analytics must follow options since it reads what options wrote.
  stages:
    - universe
    - ohlcv
    - intraday
    - options
    - options_analytics
    - sec_edgar
    - fred
    - finra
    - earnings
    - gdelt
    - finnhub
  # A stage failing does not stop later stages; it is recorded in the run summary.
  continue_on_stage_failure: true
  # Per-stage wall-clock cap. null = no cap.
  stage_timeout_minutes:
    options: 360
    intraday: 60
    options_analytics: 60
    finra: 20
    earnings: 30
    ohlcv: 60
    sec_edgar: 120
    fred: 20
    gdelt: 30
    finnhub: 30

logging:
  level: INFO
  # Rotating file logs under <root>/_logs/
  file_level: DEBUG
  retention_days: 90
  json_logs: false

compaction:
  enabled: true
  # Merge daily delta files older than this into consolidated partition files.
  min_age_days: 2
  # Datasets to compact.
  datasets: [ohlcv, intraday_bars, options_chains, options_greeks, news_events, filings_text, short_volume]
